[project]
name = "tagforge-backend"
version = "0.8.0"
description = "Tag Forge backend: ingest, classify and serve NovelAI/Danbooru tag data."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
llm = [
    "openai>=1.50",
    "anthropic>=0.34",
]

[project.scripts]
tagforge = "backend.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# This file lives in backend/, so `include = ["backend*"]` under
# packages.find matched nothing and produced an empty distribution.
# Map the "backend" package to this directory instead.
[tool.setuptools]
packages = ["backend", "backend.ingest", "backend.routes"]

[tool.setuptools.package-dir]
backend = "."
