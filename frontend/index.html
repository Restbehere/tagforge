<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tag Forge</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash of the
      // wrong theme. Must stay a plain blocking script, above stylesheets.
      (function () {
        try {
          var t = localStorage.getItem("tagforge.theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var a = localStorage.getItem("tagforge.accent");
          if (a && a !== "violet") {
            document.documentElement.setAttribute("data-accent", a);
          }
        } catch (e) {}
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
